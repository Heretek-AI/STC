[package]
name = "studio-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
studio-core = { path = "../studio-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
